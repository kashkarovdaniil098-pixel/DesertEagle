name: Build Desert Eagle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build mod
        run: dotnet build DesertEagle.csproj --configuration Release

      - name: Save DLL
        uses: actions/upload-artifact@v4
        with:
          name: DesertEagle
          path: bin/Release/net6.0/
